name: Баг
description: Что-то работает не так, как описано
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что происходит
      description: Опишите поведение и чем оно отличается от ожидаемого.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Как воспроизвести
      description: Минимальный кусок кода. Токены и e-mail замените заглушками.
      render: python
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback
      render: text

  - type: input
    id: version
    attributes:
      label: Версия PlayerokAPI
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Версия Python
      placeholder: "3.12.10"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Перед отправкой
      options:
        - label: Я убрал из текста токен, e-mail и прочие личные данные
          required: true
        - label: Я проверил, что проблема воспроизводится на последней версии
          required: true
