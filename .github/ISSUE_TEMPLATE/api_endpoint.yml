name: Новая ручка API
description: Найден маршрут, которого нет в docs/api-map.md
labels: [api-map]
body:
  - type: input
    id: route
    attributes:
      label: Метод и путь
      placeholder: "GET /rest-api/public/viewer/config"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Бэкенд
      options: [public, bff, auth, internal, admin, catalog, graphql, ws]
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Откуда известно
      description: Чанк фронтенда, вкладка Network, ответ сервера.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: Параметры и ответ
      render: json
